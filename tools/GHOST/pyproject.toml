[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-em2d"
version = "0.1.1"
description = "GHOST 2-D and body-of-revolution electromagnetic boundary-integral solvers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
gui = ["PySide6>=6.6,<7", "matplotlib>=3.8,<4"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["ghost_backend*"]
exclude = ["ghost_backend.tests*", "ghost_backend.*.tests*", "ghost_backend.validation.gap_feature_isolation*"]
namespaces = true

[tool.setuptools.package-data]
"ghost_backend.twod.assembly.native" = ["*.c"]
"ghost_backend.bor.native" = ["*.c"]
"ghost_backend.geometry" = ["geometries/*.geo", "geometries/BOR/*.geo", "templates/*.csv"]

[tool.setuptools.exclude-package-data]
"*" = ["*.dll", "*.so", "*.dylib"]

[tool.pytest.ini_options]
testpaths = ["ghost_backend/tests"]
